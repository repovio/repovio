name: Test
on:
  workflow_call:
    inputs:
      api:
        type: boolean
        required: true
      web:
        type: boolean
        required: true
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: inputs.api
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://repovio:repovio@localhost:5432/repovio_test?schema=public
      SHADOW_DATABASE_URL: postgresql://repovio:repovio@localhost:5432/repovio_shadow?schema=public

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: repovio_test
          POSTGRES_USER: repovio
          POSTGRES_PASSWORD: repovio
        options: >-
          --health-cmd "pg_isready -U repovio -d repovio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.28.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Prisma shadow database
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U repovio -d postgres
          -c 'CREATE DATABASE repovio_shadow;'

      - name: Build shared schema contracts
        run: pnpm --filter @repovio/schemas build

      - name: Verify dependency security regressions
        run: pnpm test:dependencies

      - name: Generate Prisma client
        if: hashFiles('apps/api/prisma/schema.prisma') != ''
        run: pnpm nx run api:db:generate

      - name: Apply Prisma migrations
        if: hashFiles('apps/api/prisma/migrations/**/migration.sql') != ''
        run: pnpm --dir apps/api exec prisma migrate deploy

      - name: Test API
        if: hashFiles('apps/api/jest.config.ts') != ''
        run: pnpm nx run api:test

      - name: Verify offline OpenAPI export
        run: pnpm --filter @repovio/api test:openapi

  postgres-upgrade:
    if: inputs.api
    name: Test PostgreSQL major upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Build API image with production dependencies
        run: docker build -f apps/api/Dockerfile -t repovio-api:upgrade-test .

      - name: Verify fresh PostgreSQL 18 and PostgreSQL 17 dump restoration
        env:
          REPOVIO_TEST_API_IMAGE: repovio-api:upgrade-test
        run: node --test scripts/check-postgres-upgrade.test.mjs

  web:
    if: inputs.web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.28.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test dashboard
        run: pnpm --filter @repovio/web test
