name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://repovio:repovio@localhost:5432/repovio_lint
      SHADOW_DATABASE_URL: postgresql://repovio:repovio@localhost:5432/repovio_lint_shadow

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.28.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared schema contracts
        run: pnpm --filter @repovio/schemas build

      - name: Test shared schema contracts
        run: pnpm --filter @repovio/schemas test

      - name: Test coding guideline checks
        run: pnpm test:guidelines

      - name: Check documentation coverage
        run: pnpm documentation:check

      - name: Check formatting
        run: pnpm format:check

      - name: Verify product branding
        run: pnpm branding:check

      - name: Lint shared configuration
        run: pnpm exec eslint .

      - name: Lint API
        if: hashFiles('apps/api/tsconfig.json') != ''
        run: pnpm --dir apps/api lint

      - name: Typecheck API
        if: hashFiles('apps/api/tsconfig.json') != ''
        run: pnpm nx run api:db:generate && pnpm --dir apps/api typecheck

      - name: Lint web app
        if: hashFiles('apps/web/nuxt.config.ts') != ''
        run: pnpm --dir apps/web lint

      - name: Typecheck web app
        if: hashFiles('apps/web/nuxt.config.ts') != ''
        run: pnpm --dir apps/web typecheck
