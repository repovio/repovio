name: Lint
on:
  workflow_call:
    inputs:
      api:
        type: boolean
        required: true
      web:
        type: boolean
        required: true
      root:
        type: boolean
        required: true
permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: inputs.api || inputs.web || inputs.root
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://repovio:repovio@localhost:5432/repovio_lint
      SHADOW_DATABASE_URL: postgresql://repovio:repovio@localhost:5432/repovio_lint_shadow

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.28.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Changesets base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin refs/heads/main:refs/heads/main

      - name: Validate Changesets configuration
        if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
        run: pnpm changeset status

      - name: Build shared schema contracts
        if: inputs.api || inputs.web
        run: pnpm --filter @repovio/schemas build

      - name: Test shared schema contracts
        if: inputs.api || inputs.web
        run: pnpm --filter @repovio/schemas test

      - name: Test CI selection and release isolation
        run: pnpm test:ci

      - name: Test coding guideline checks
        run: pnpm test:guidelines

      - name: Check documentation coverage
        run: pnpm documentation:check

      - name: Check formatting
        run: pnpm format:check

      - name: Verify product branding
        run: pnpm branding:check

      - name: Lint shared configuration
        run: pnpm exec eslint scripts libs ./*.mjs

      - name: Lint API
        if: inputs.api
        run: pnpm --dir apps/api lint

      - name: Typecheck API
        if: inputs.api
        run: pnpm nx run api:db:generate && pnpm --dir apps/api typecheck

      - name: Lint web app
        if: inputs.web
        run: pnpm exec eslint apps/web

      - name: Typecheck web app
        if: inputs.web
        run: pnpm --dir apps/web typecheck
