name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.28.9

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          github-token: ${{ secrets.CHANGESETS_PR_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: true

  publish-images:
    name: Publish container images
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      images-ready: ${{ steps.image-inputs.outputs.ready }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check image build inputs
        id: image-inputs
        run: |
          if [[ -f apps/api/Dockerfile && -f apps/web/Dockerfile ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Dockerfiles are not available yet; skipping image publication.'
          fi

      - name: Set up Docker Buildx
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release version
        if: steps.image-inputs.outputs.ready == 'true'
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/repovio-api:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/repovio-api:latest

      - name: Build and push web image
        if: steps.image-inputs.outputs.ready == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/repovio-web:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/repovio-web:latest

  smoke-release:
    name: Smoke test release images
    needs:
      - release
      - publish-images
    if: >-
      needs.release.outputs.published == 'true' && needs.publish-images.outputs.images-ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Compose smoke-test inputs
        id: compose-inputs
        run: |
          if [[ -f compose.yml ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Compose configuration is not available yet; skipping smoke test.'
          fi

      - name: Log in to GitHub Container Registry
        if: steps.compose-inputs.outputs.ready == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release version
        if: steps.compose-inputs.outputs.ready == 'true'
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare Compose environment
        if: steps.compose-inputs.outputs.ready == 'true'
        run: |
          cp .env.example .env
          encryption_key="$(openssl rand -base64 32)"
          sed -i "s|^TOKEN_ENCRYPTION_KEY=.*$|TOKEN_ENCRYPTION_KEY=${encryption_key}|" .env

      - name: Validate release image tags
        if: steps.compose-inputs.outputs.ready == 'true'
        env:
          REPOVIO_VERSION: ${{ steps.version.outputs.value }}
        run: |
          expected_api="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repovio-api:${REPOVIO_VERSION}"
          expected_web="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/repovio-web:${REPOVIO_VERSION}"
          docker compose -f compose.yml config --images | grep --fixed-strings --line-regexp "$expected_api"
          docker compose -f compose.yml config --images | grep --fixed-strings --line-regexp "$expected_web"

      - name: Start release stack
        if: steps.compose-inputs.outputs.ready == 'true'
        env:
          REPOVIO_VERSION: ${{ steps.version.outputs.value }}
        run: docker compose -f compose.yml up --detach --wait --wait-timeout 120

      - name: Check API health
        if: steps.compose-inputs.outputs.ready == 'true'
        run: curl --fail --retry 12 --retry-connrefused --retry-delay 5 http://localhost:3001/api/health

      - name: Show release stack logs on failure
        if: failure() && steps.compose-inputs.outputs.ready == 'true'
        run: docker compose -f compose.yml logs --no-color

      - name: Stop release stack
        if: always() && steps.compose-inputs.outputs.ready == 'true'
        run: docker compose -f compose.yml down --volumes --remove-orphans

  notify-documentation:
    name: Notify versioned documentation publisher
    needs: [release, smoke-release]
    if: needs.release.outputs.published == 'true' && vars.DOCS_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out released application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create restricted publication dispatcher token
        id: dispatcher
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: repovio
          repositories: docs,website
          permission-contents: write
      - name: Dispatch exact release and reviewed documentation source
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json")).version')"
          tag="repovio@$version"
          revision="$(git rev-parse "$tag^{commit}")"
          test "$revision" = "$(git rev-parse HEAD)"
          docs_revision="$(gh api repos/repovio/docs/commits/main --jq .sha)"
          jq -n --arg tag "$tag" --arg revision "$revision" --arg docsRevision "$docs_revision" \
            '{event_type: "application-released", client_payload: {tag: $tag, revision: $revision, docsRevision: $docsRevision}}' \
            | gh api --method POST repos/repovio/website/dispatches --input -
